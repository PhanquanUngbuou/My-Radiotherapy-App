<!DOCTYPE html>
<!-- Điều phối Xạ trị · phiên bản v2.5 -->
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điều phối Xạ trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Phong cách bệnh viện hiện đại: nền trắng – xanh xám nhạt, xanh ngọc chủ đạo, xanh dương phụ; nút bo tròn, bóng đổ nhẹ. */
[hidden]{display:none!important}
:root{
  --bg:#f3f7fb; --surface:#ffffff; --surface-2:#eaf0f5; --surface-3:#f7fafc; --ink:#2b3440; --muted:#6b7785; --line:#dfe6ed;
  --accent:#138a6c; --accent-ink:#ffffff; --accent-soft:#e3f4ee; --accent-2:#51be9d; --blue:#0076c0; --blue-soft:#e3f0fa;
  --bs:#0076c0; --bs-soft:#e3f0fa; --ks:#7652c4; --ks-soft:#efe9fa; --ktv:#138a6c; --ktv-soft:#e3f4ee; --dd:#c24c76; --dd-soft:#fbe7ee;
  --ok:#138a6c; --ok-soft:#e3f4ee; --warn:#a35f00; --warn-soft:#fff2dc; --crit:#c8372d; --crit-soft:#fde6e3;
  --shadow:0 0 10px rgba(16,40,60,.08); --shadow-lg:0 12px 40px rgba(16,40,60,.18);
  --head-grad:linear-gradient(90deg,#138a6c 0%,#2aa58a 45%,#0076c0 100%);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222c; --surface-2:#1e2d39; --surface-3:#1a2731; --ink:#e3ebf1; --muted:#97a6b3; --line:#2a3a47;
  --accent:#4fc3a1; --accent-ink:#06271f; --accent-soft:#16372e; --accent-2:#51be9d; --blue:#5fb2ea; --blue-soft:#14304a;
  --bs:#6db6ec; --bs-soft:#14304a; --ks:#b49af0; --ks-soft:#2b2343; --ktv:#4fc3a1; --ktv-soft:#16372e; --dd:#f08fb2; --dd-soft:#3c1d2a;
  --ok:#4fc3a1; --ok-soft:#16372e; --warn:#f0b450; --warn-soft:#3a2b10; --crit:#ff8b80; --crit-soft:#3f1b18;
  --shadow:0 0 0 1px rgba(255,255,255,.04); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  --head-grad:linear-gradient(90deg,#0f6b54 0%,#16806a 45%,#0a5a91 100%); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222c; --surface-2:#1e2d39; --surface-3:#1a2731; --ink:#e3ebf1; --muted:#97a6b3; --line:#2a3a47;
  --accent:#4fc3a1; --accent-ink:#06271f; --accent-soft:#16372e; --accent-2:#51be9d; --blue:#5fb2ea; --blue-soft:#14304a;
  --bs:#6db6ec; --bs-soft:#14304a; --ks:#b49af0; --ks-soft:#2b2343; --ktv:#4fc3a1; --ktv-soft:#16372e; --dd:#f08fb2; --dd-soft:#3c1d2a;
  --ok:#4fc3a1; --ok-soft:#16372e; --warn:#f0b450; --warn-soft:#3a2b10; --crit:#ff8b80; --crit-soft:#3f1b18;
  --shadow:0 0 0 1px rgba(255,255,255,.04); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  --head-grad:linear-gradient(90deg,#0f6b54 0%,#16806a 45%,#0a5a91 100%); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sub{display:block;font-size:12.5px;color:var(--muted)}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#138a6c}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 2px 12px rgba(16,40,60,.08)}
.util{background:var(--head-grad);color:#fff;font-size:12.5px}
.util-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.util-in span{opacity:.95}
.util-in b{font-weight:600}
.top-in,.tabs-in,.main-in,.demo-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap;color:var(--accent);letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.brand-mark{width:38px;height:38px;border-radius:50%;background:var(--head-grad);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 16px 9px 38px;border:1px solid var(--line);border-radius:25px;background:var(--surface-3)}
.search input:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.who select{padding:7px 12px;border:1px solid var(--line);border-radius:25px;background:var(--surface);max-width:220px}
.role{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.role-BS{background:var(--bs-soft);color:var(--bs)} .role-KS{background:var(--ks-soft);color:var(--ks)}
.role-KTV{background:var(--ktv-soft);color:var(--ktv)} .role-DD{background:var(--dd-soft);color:var(--dd)} .role-ADMIN{background:var(--accent-soft);color:var(--accent)}

.tabs{border-top:1px solid var(--line)}
.tabs .btn{margin-block:6px}
.tabs-in{display:flex;gap:4px;overflow-x:auto;align-items:center}
.tab{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--accent)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent-2)}
.tabs .spacer{flex:1}

.demo-bar{background:var(--warn-soft);color:var(--ink);font-size:13px}
.demo-in{padding-block:7px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.demo-in b{color:var(--warn)}

.main-in{padding-block:20px 80px;display:grid;gap:22px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.015em}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:25px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:14px 16px;display:grid;gap:2px;text-align:left;cursor:pointer;position:relative}
.kpi:hover{border-color:var(--accent-2)}
.kpi .n{font-size:30px;letter-spacing:-.02em;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .kx{font-size:12px;font-weight:600}
.kpi::before{content:"";position:absolute;right:14px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--k,transparent)}
.kpi.zero .n{color:var(--muted)}

.group{display:grid;gap:8px;scroll-margin-top:130px}
.group-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group-head h2{font-size:16px;font-weight:700}
.group-head .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.group-head .hint{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.empty{padding:14px 16px;color:var(--muted);font-size:13.5px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-3)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-3)}
td.act{text-align:right;white-space:nowrap}
td.act .btn + .btn{margin-left:6px}
.pt b{font-weight:600}
.nowrap{white-space:nowrap}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-CONTOUR{background:var(--bs-soft);color:var(--bs)}
.st-CHO_KH,.st-DANG_KH{background:var(--ks-soft);color:var(--ks)}
.st-CHO_QA{background:var(--warn-soft);color:var(--warn)}
.st-CHO_XA{background:var(--accent-soft);color:var(--accent)}
.st-DANG_XA{background:var(--ktv-soft);color:var(--ktv)}
.st-TAM_NGUNG{background:var(--crit-soft);color:var(--crit)}
.st-HOAN_THANH{background:var(--surface-2);color:var(--muted)}
.pr-0{background:var(--crit-soft);color:var(--crit)} .pr-1{background:var(--warn-soft);color:var(--warn)} .pr-2{background:var(--surface-2);color:var(--muted)}
.flag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.flag.crit{background:var(--crit-soft);color:var(--crit)}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}

.prog{display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar{width:84px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:25px;padding:7px 16px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent-2);color:var(--accent)}
.btn.primary:hover,.btn.ok:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--crit)}
.btn.big{padding:9px 20px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.day-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.load{display:grid;grid-template-columns:repeat(6,minmax(64px,1fr));gap:8px}
.load div{background:var(--surface);box-shadow:var(--shadow);border:1px solid transparent;border-radius:12px;padding:8px 10px;display:grid;gap:2px}
.load .d{font-size:12px;color:var(--muted)}
.load .v{font-size:18px;font-weight:600}
.load .today{border-color:var(--accent-2)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{background:var(--surface);border-bottom:3px solid var(--accent-2);padding:14px 18px;display:grid;gap:6px}
.drawer-head .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.drawer-head h2{font-size:20px;font-weight:700}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:none}
.drawer-body{overflow-y:auto;padding:16px 18px 24px;display:grid;gap:16px;align-content:start}
.drawer-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap}
.sec{background:var(--surface);box-shadow:var(--shadow);border:1px solid transparent;border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.sec h3{font-size:14px;color:var(--accent);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div{display:grid;gap:1px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:600;overflow-wrap:anywhere}
.big-prog{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.big-prog .n{letter-spacing:-.02em;font-size:26px;font-weight:600;line-height:1.1}
.big-prog .n small{font-size:15px;color:var(--muted);font-weight:500}
.big-prog .l{font-size:12px;color:var(--muted)}
.bar.wide{width:100%;height:8px}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;font-weight:600;padding:0 4px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal .c{min-height:44px;border-radius:6px;padding:3px 4px;font-size:11px;display:grid;align-content:space-between;background:var(--surface-3);color:var(--muted);border:1px solid transparent}
.cal .c .dd{font-variant-numeric:tabular-nums}
.cal .c .ic{font-weight:600;font-size:10.5px;letter-spacing:.02em}
.cal .done{background:var(--ktv-soft);color:var(--ktv)}
.cal .done .fx{font-weight:700}
.cal .miss{background:var(--crit-soft);color:var(--crit)}
.cal .plan{background:var(--surface);border:1px dashed var(--accent);color:var(--accent)}
.cal .off{opacity:.5}
.cal .today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .blank{background:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:13.5px}
.timeline .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.timeline .pending{color:var(--muted)}
.note-box{white-space:pre-wrap;font-size:13.5px;background:var(--surface-3);border-radius:8px;padding:10px 12px}
.img-sum{display:grid;gap:6px;font-size:13.5px}
.img-sum div{display:grid;grid-template-columns:130px 1fr;gap:8px}
.img-sum .dates{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,20,28,.45)}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:18px 20px 8px;border-top:4px solid var(--accent-2);border-radius:16px 16px 0 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.modal-head h2{font-size:18px}
.modal-body{padding:8px 20px 16px;overflow-y:auto;min-height:0;flex:1 1 auto;display:grid;gap:14px}
.modal-foot{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1 / -1}
.field{display:grid;gap:4px;min-width:0}
.field label,.field .lb{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=email],.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:64px;resize:vertical}
.field .help{font-size:12px;color:var(--muted)}
.req{color:var(--crit)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;padding:7px 14px;border:1px solid var(--line);border-radius:25px;cursor:pointer;font-weight:600;font-size:13.5px}
.checks input:checked + span{color:var(--accent)}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--accent-2);background:var(--accent-soft)}
.radios label small{display:block;color:var(--muted);font-size:12.5px}
.who-box{background:var(--surface-3);border-radius:10px;padding:12px 14px;display:grid;gap:3px}
.who-box .nm{font-size:19px;font-weight:700}
.who-box .his{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:15px;font-weight:600}
.confirm{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--warn-soft);font-weight:600;cursor:pointer}
.confirm input{width:20px;height:20px;flex:none;margin-top:1px}
.preview{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:10px 12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:25px;box-shadow:var(--shadow-lg);font-weight:600;max-width:calc(100% - 32px)}
.toast.err{background:var(--crit);color:#fff}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
@media (prefers-reduced-motion: reduce){.busy{animation:none;background:var(--accent)}}
.notice{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:24px;max-width:560px;margin:40px auto;display:grid;gap:10px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{padding:8px 14px;border:1px solid var(--line);border-radius:25px;background:var(--surface)}

@media (max-width:700px){
  .form{grid-template-columns:1fr}
  .who .nm{display:none}
  .search{order:3;flex-basis:100%}
  .load{grid-template-columns:repeat(3,minmax(0,1fr))}
  .timeline li{grid-template-columns:72px 1fr}
  .img-sum div{grid-template-columns:1fr}
}

/* Quản trị */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:25px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.chip button{border:0;background:none;color:inherit;cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}
.chip button:hover{background:var(--surface)}
.inline-add{display:flex;gap:8px;align-items:center}
.inline-add input{flex:1;min-width:0;padding:7px 14px;border:1px solid var(--line);border-radius:25px;background:var(--surface)}
.pad{padding:14px 16px;display:grid;gap:10px;align-content:start}
.pad h3{font-size:15px;font-weight:700}
.off-user td{opacity:.55}
.ended{color:var(--warn);font-size:12px;font-weight:600}
.tag.boost{background:var(--ks-soft);color:var(--ks)}

/* Lịch tuần */
.wk-table th,.wk-table td{text-align:center}
.wk-table th:first-child,.wk-table td:first-child,.wk-table th:nth-child(2),.wk-table td:nth-child(2),.wk-table th:nth-child(3),.wk-table td:nth-child(3){text-align:left}
.wk-pt{cursor:pointer}
.wk{display:inline-grid;place-items:center;min-width:58px;height:34px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid transparent;background:none;font-variant-numeric:tabular-nums}
button.wk{cursor:pointer}
button.wk:hover{border-color:var(--accent-2)}
.wk.done{background:var(--ktv-soft);color:var(--ktv)}
.wk.plan{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-2)}
.wk.plan.tent{background:none;color:var(--ks);border:1px dashed var(--ks)}
.wk.miss{background:var(--crit-soft);color:var(--crit)}
.wk.off{color:var(--muted)}
.wk.closed{background:var(--surface-2);color:var(--muted);font-size:11.5px}
.wk.paused{color:var(--crit);font-size:12px}
.wk.ex{box-shadow:inset 0 0 0 2px var(--warn)}
.wk.today{outline:2px solid var(--ink);outline-offset:1px}
.wk-today{color:var(--accent)!important}
.wk-count{font-size:13px;color:var(--muted);background:var(--surface-3)}
.wk-count b{color:var(--ink);font-size:15px}
.st-MO_PHONG{background:var(--blue-soft);color:var(--blue)}
.st-SAN_SANG{background:var(--ktv-soft);color:var(--ktv)}

.sec-lb{font-size:13px;font-weight:700;color:var(--accent);padding-top:6px;border-top:1px solid var(--line)}

/* Thông báo máy */
.notice-bar{background:var(--warn-soft);color:var(--ink);font-size:13.5px;border-bottom:1px solid var(--line)}
.notice-bar .util-in{display:grid;gap:4px}
.nb-meta{color:var(--muted);font-size:12.5px}
.nb-x{border:0;background:none;color:var(--warn);font-weight:600;cursor:pointer;padding:0 4px;font-size:12.5px}
/* Chuông */
.bell-wrap{position:relative}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.bell:hover{border-color:var(--accent-2);color:var(--accent)}
.bell svg{width:18px;height:18px}
.bell-n{position:absolute;top:-4px;right:-4px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.bell-panel{position:absolute;right:0;top:46px;width:min(360px,calc(100vw - 32px));max-height:420px;overflow-y:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);z-index:35;display:grid}
.bp-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.bp-item{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer;font-size:13.5px}
.bp-item:hover{background:var(--surface-3)}
/* Phân công */
.duty{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.duty b{color:var(--accent)}
.rs-table th,.rs-table td{vertical-align:top}
.rs-pos{font-weight:600;white-space:nowrap;background:var(--surface-3);text-align:left;font-size:13.5px;color:var(--ink);text-transform:none;letter-spacing:0}
.rs-cell{width:100%;min-height:40px;border:1px dashed var(--line);background:none;border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;cursor:pointer;text-align:left}
.rs-cell:hover{border-color:var(--accent-2)}
.rs-name{background:var(--ktv-soft);color:var(--ktv);font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rs-name.me{background:var(--accent);color:var(--accent-ink)}
.rs-note{display:block;width:100%;font-size:11.5px;color:var(--muted)}
.rs-today{background:var(--accent-soft)}
td.rs-today .rs-cell{border-color:var(--accent-2)}

/* Nút nổi thêm BN trên điện thoại (nút ở thanh tab bị khuất khi màn hình hẹp) */
.fab{display:none;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  align-items:center;gap:6px;border:0;border-radius:28px;padding:13px 20px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;
  box-shadow:var(--shadow-lg);cursor:pointer}
.fab span{font-size:20px;line-height:1}
@media (max-width:760px){ .fab{display:flex} #add-bn{display:none} .main-in{padding-bottom:110px} .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))} }

/* Thanh "Đang dùng tài khoản" */
.me-bar{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.me-bar .util-in{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:center;padding-block:6px}
.me-bar b{color:var(--ink)}
.me-mail{color:var(--muted);font-size:12px}
.me-switch{color:var(--accent);font-weight:600;font-size:12.5px;white-space:nowrap}
@media (max-width:700px){ .me-mail{display:block} }

/* v2.5: form thêm BN, mã ICD, cảnh báo mã HIS */
details.more{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface-3)}
details.more>summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--ink);list-style:revert}
details.more[open]{padding-bottom:14px}
details.more>.form{margin-top:4px}
.his-note{border:1px solid var(--line);background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.his-note.bad{background:var(--crit-soft);border-color:var(--crit)}
.his-note ul{margin:6px 0 6px 18px;padding:0}
.icd-tag{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
#icd-nm.icd-ok{color:var(--accent);font-weight:600}
#icd-nm.icd-bad{color:var(--crit)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.modal.wide{max-width:min(1040px,96vw);width:100%}

/* Menu theo quy trình */
.tab .step-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:700;margin-right:6px}
.tab[aria-selected=true] .step-n{background:var(--accent);color:var(--accent-ink)}
.step-c{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;line-height:18px;text-align:center}
.tab{white-space:nowrap;padding-inline:11px}
@media (max-width:760px){.tab{padding-inline:10px}}
.tx-seg{margin:4px 0 14px}
/* Form trên điện thoại: toàn màn hình, nút lưu luôn hiện */
html.modal-open,html.modal-open body{overflow:hidden;overscroll-behavior:none}
.mh-act{display:flex;align-items:center;gap:8px}
.mh-save{display:none}
@media (max-width:760px){
  .modal-wrap{padding:0;place-items:stretch}
  .modal,.modal.wide{width:100%;max-width:none;height:100%;max-height:none;border-radius:0}
  .modal-head{border-radius:0;padding:12px 16px 8px}
  .modal-body{padding:8px 16px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .modal-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .mh-save{display:inline-flex}
}
#add-bn{white-space:nowrap;flex:none}

</style>
</head>

      if (IS_GAS) {
        google.script.run.withSuccessHandler(done).withFailureHandler(function (e) { reject({ error: String(e && e.message || e) }); }).api(action, payload || null);
      } else if (window.DEMO) {

  function applyLocal(data, action, payload) {
    var ctx = RT.localCtx(data, nowStr());

  /** Cập nhật màn hình ngay bằng lõi nghiệp vụ chạy trên trình duyệt, rồi lưu lên máy chủ phía sau. */
  function act(action, payload) {
    if (action in LOCAL) {
      setBusy(1);
      return call(action, payload).then(function (r) {
        setData(r.data);
        if (r.rev) S.rev = r.rev;
        if (r.roster) S.rosterExtra = r.roster;
        if (r.log) S.log = r.log;
        if (r.msg) toast(r.msg);
        render();
        return r;

    }
    var local;
    try { local = applyLocal(S.data, action, payload); }
    catch (e) { return Promise.reject({ error: String(e && e.message || e) }); }
    var op = { action: action, payload: payload };
    pending.push(op);
    setData(local.data);
    toast(local.msg);
    render();
    setBusy(1);
    chain = chain.then(function () {
      return call(action, payload).then(function (r) {
        pending.shift();

        pending.forEach(function (o) { try { d = applyLocal(d, o.action, o.payload).data; } catch (e) { /* bỏ qua, máy chủ sẽ báo */ } });
        setData(d); render();
      }, function (e) {
        pending.shift();
        toast('Chưa lưu được: ' + (errText(e) || 'mất kết nối') + '. Đã tải lại dữ liệu.', true);
        return call('bootstrap').then(function (r) { setData(r.data); render(); }, function () {});
      });
    }).finally(function () { setBusy(-1); });
    return Promise.resolve({ ok: true, msg: local.msg });
  }

    html += group('ks', 'Kỹ sư đang lập kế hoạch', g.ks, [C.pt, C.dx, C.rx, C.pr,

      { h: 'Contour xong', cls: 'nowrap', v: function (p) { return '<span class="num">' + fd(p.ngay_contour_xong) + '</span><span class="sub">' + daysSince(p.ngay_contour_xong) + ' ngày trước</span>'; } },
      scope === 'all' ? C.bs : null].filter(Boolean), null, 'Không có bệnh nhân ở bước lập kế hoạch.');
    html += group('qa', 'Chờ QA', g.qa, [C.pt, C.dx, C.rx,

      { h: 'Lý do', v: function (p) { return esc(p.ly_do_tam_ngung); } }, scope === 'all' ? C.bs : null].filter(Boolean), null, 'Không có bệnh nhân tạm ngừng xạ.');

  // ---------- Bệnh nhân của tôi: nội dung theo vai trò ----------

      { h: '', cls: 'act', v: function (p) { return (p._g ? '<span class="tag boost">Mô phỏng lại boost</span> ' : '') + (can('simDone') ? btn('simDone', p.id, 'Đã mô phỏng xong', 'primary') : ''); } }];
    return stepHead('① Mô phỏng', 'BN đã có chỉ định xạ, chờ chụp CT mô phỏng. Chụp xong bấm “Đã mô phỏng xong”, BN chuyển sang bước Contour.', f.ui) +
      '<div class="kpis">' + kpi('simd', due.length, 'Hẹn hôm nay / quá hẹn', 'var(--accent)') + kpi('siml', later.length, 'Hẹn các ngày tới', 'var(--line)') + kpi('simn', none.length, 'Chưa có ngày hẹn', 'var(--warn)') + '</div>' +

      group('simn', 'Chưa có ngày hẹn', none, cols, null, 'Không có.');
  }
  function renderContourTab() {

      '<div class="kpis">' + kpi('ct', list.length, 'Đang chờ contour', 'var(--bs, var(--accent))', late ? '<span class="kx" style="color:var(--warn)">' + late + ' ca chờ ≥ 5 ngày</span>' : '') + '</div>' +

      { h: 'Kỹ sư', cls: 'nowrap', v: function (p) { return esc(nameOf(p.ks_email)) + '<span class="sub">nhận ' + fd(p.ngay_nhan_kh) + ' · ' + daysSince(p.ngay_nhan_kh) + ' ngày</span>'; } },

      { h: 'QA', v: function (p) { return p.qa_ket_qua === 'Đạt' ? '<span class="flag ok">Đạt ' + fd(p.ngay_qa) + '</span>' : '<span class="muted">' + esc(p.qa_ket_qua) + '</span>'; } },

  // ---------- KTV: xạ hôm nay ----------
  function renderToday(mine) {

    var machines = S.data.dm.MAY || [];
    var onM = function (p) { return !S.fMay || (p.may || machines[0]) === S.fMay; };

    var due = active.filter(function (p) { var c = course(p); return c.treatToday && !c.doneToday; })
      .sort(function (a, b) { return (a.trang_thai === 'CHO_XA' ? 0 : 1) - (b.trang_thai === 'CHO_XA' ? 0 : 1) || a.ho_ten.localeCompare(b.ho_ten, 'vi'); });
    var done = pts().filter(function (p) { return onM(p) && course(p).doneToday; });
    var off = active.filter(function (p) { var c = course(p); return !c.treatToday && !c.doneToday; });
    var paused = pts().filter(function (p) { return onM(p) && p.trang_thai === 'TAM_NGUNG'; });
    var noDate = pts().filter(function (p) { return p.trang_thai === 'CHO_XA' && !p.ngay_du_kien; }).length;
    var holiday = S.data.holidays.indexOf(t) >= 0;

    var html = (mine ? '' : dutyBanner()) + '<div class="page-head"><div><h1>' + (mine ? 'Bệnh nhân của tôi · KTV' : 'Xạ hôm nay') + ' · ' + fdw(t) + '/' + t.slice(0, 4) + '</h1><p>' +
      (holiday ? 'Hôm nay là ngày nghỉ lễ trong danh mục.' : RT.dow(t) === 6 ? 'Thứ Bảy: xạ bù cho BN IMRT/VMAT có ngày nghỉ trong tuần.' : RT.dow(t) === 0 ? 'Chủ nhật: không có lịch xạ.' : 'Bấm “Xác nhận đã xạ” ngay sau khi BN xạ xong.') + '</p></div>' +
      '<div class="filters">' + noticeBtn() + (machines.length > 1 ? '<select data-filter="fMay" aria-label="Lọc theo máy">' + opts(machines, S.fMay, 'Tất cả máy') + '</select>' : '') + '</div></div>';
    html += '<div class="kpis">' + kpi('due', due.length, 'Cần xạ hôm nay', 'var(--accent)') + kpi('done', done.length, 'Đã xạ hôm nay', 'var(--ktv)') +
      kpi('off', off.length, 'Không có lịch hôm nay', 'var(--line)') + kpi('paused', paused.length, 'Tạm ngừng', 'var(--crit)') + '</div>';
    if (noDate && !mine) html += '<div class="card"><div class="empty">Có <b>' + noDate + '</b> bệnh nhân chờ vào xạ chưa được xếp lịch. <button class="btn sm" data-txsub="sched">Mở “Chờ xếp lịch”</button></div></div>';
    var mineExtra = '';
    if (mine) {
      var sim = items().filter(function (p) { return p.trang_thai === 'MO_PHONG' && p.ngay_mo_phong && p.ngay_mo_phong <= t; }).sort(function (a, b) { return a.ngay_mo_phong < b.ngay_mo_phong ? -1 : 1; });
      var noSched = pts().filter(function (p) { return p.trang_thai === 'CHO_XA' && !p.ngay_du_kien; });
      mineExtra += group('simt', 'Mô phỏng hôm nay', sim, [C.pt,
        { h: 'Hẹn', cls: 'nowrap', v: function (p) { return '<span class="num">' + fdw(p.ngay_mo_phong) + '</span>' + (p.ngay_mo_phong < t ? '<span class="sub" style="color:var(--warn)">quá hẹn ' + RT.diffDays(p.ngay_mo_phong, t) + ' ngày</span>' : ''); } },
        C.dx, C.bs, { h: '', cls: 'act', v: function (p) { return can('simDone') ? btn('simDone', p.id, 'Đã mô phỏng xong', 'primary') : ''; } }],
        '<button class="btn sm" data-gotab="sim">Xem tất cả lịch mô phỏng</button>', 'Không có BN hẹn mô phỏng hôm nay.');
      mineExtra += group('nosched', 'Chờ vào xạ, chưa xếp lịch', noSched, [C.pt, C.rx, C.bs,
        { h: 'QA', v: function (p) { return p.qa_ket_qua === 'Đạt' ? '<span class="flag ok">Đạt</span>' : '<span class="muted">' + esc(p.qa_ket_qua || '—') + '</span>'; } },
        { h: '', cls: 'act', v: function (p) { return can('schedule') ? btn('schedule', p.id, 'Xếp lịch', 'primary') : ''; } }], null, 'Không có BN chờ xếp lịch.');
    }

    html += group('due', 'Cần xạ hôm nay', due, [C.pt,
      { h: 'Kỹ thuật', cls: 'nowrap', v: function (p) { var c = course(p); return esc(c.cur.ky_thuat) + (c.multi ? ' <span class="tag boost">' + c.cur.label + '</span>' : '') + '<span class="sub">' + c.dosePerFx + ' Gy/buổi</span>'; } },
      { h: 'Buổi', cls: 'nowrap', v: function (p) { var c = course(p); var first = c.done === 0 ? ' <span class="flag">Buổi đầu</span>' : (c.multi && c.done === c.cur.from ? ' <span class="flag">Buổi đầu ' + c.cur.label + '</span>' : ''); return '<b class="num">' + (c.done + 1) + '/' + c.total + '</b>' + first; } },
      { h: 'IGRT / SGRT', v: function (p) { return (p.igrt && p.igrt !== 'Không' ? esc(p.igrt) : '<span class="muted">Không IGRT</span>') + (p.sgrt === 'Có' ? '<span class="sub">Có SGRT</span>' : ''); } },
      C.week,
      { h: '', cls: 'act', v: function (p) { var c = course(p); if (c.blocked) return '<span class="flag crit">Chờ KH boost ' + esc(c.cur.label) + '</span>'; return can('logFraction') ? btn('logFx', p.id, '✓ Xác nhận đã xạ', 'ok big') : ''; } }
    ], null, holiday || RT.dow(t) === 0 ? 'Hôm nay không có lịch xạ.' : 'Đã xạ xong tất cả bệnh nhân có lịch hôm nay.') + mineExtra;
    html += group('done', 'Đã xạ hôm nay', done, [C.pt,
      { h: 'Buổi', cls: 'nowrap', v: function (p) { var c = course(p); return '<span class="num">' + c.done + '/' + c.total + '</span>'; } },
      { h: 'Hình ảnh / định vị', v: function (p) { var f = course(p).fx.filter(function (x) { return x.ngay === t; }); return f.map(function (x) { return esc(x.hinh_anh || '—'); }).join('<br>'); } },
      { h: 'KTV ghi', cls: 'nowrap', v: function (p) { var f = course(p).fx.filter(function (x) { return x.ngay === t; }); return f.map(function (x) { return esc(nameOf(x.ktv_email)) + ' <span class="muted mono">' + String(x.thoi_gian).slice(11, 16) + '</span>'; }).join('<br>'); } },
      C.st,
      { h: '', cls: 'act', v: function (p) { var f = course(p).fx.filter(function (x) { return x.ngay === t; }); return can('undoFraction') && f.length ? btn('undoFx', f[f.length - 1].id, 'Huỷ buổi này', 'danger') : ''; } }
    ], null, 'Chưa ghi buổi xạ nào hôm nay.');
    html += group('off', 'Không có lịch hôm nay', off, [C.pt, C.rx, C.week, C.prog,
      { h: '', cls: 'act', v: function (p) { return can('logFraction') ? btn('logFx', p.id, 'Ghi buổi xạ bù') : ''; } }
    ], 'BN IMRT/VMAT vào ngày nghỉ trong tuần, hoặc BN có ngày bắt đầu sau hôm nay.', 'Không có.');
    html += group('paused', 'Đang tạm ngừng', paused, [C.pt, C.prog,
      { h: 'Từ ngày', cls: 'nowrap', v: function (p) { return '<span class="num">' + fdw(p.tam_ngung_tu) + '</span><span class="sub">' + daysSince(p.tam_ngung_tu) + ' ngày</span>'; } },
      { h: 'Lý do', v: function (p) { return esc(p.ly_do_tam_ngung); } },
      { h: '', cls: 'act', v: function (p) { return (can('resume') ? btn('resume', p.id, 'Tiếp tục xạ') : '') + (can('logFraction') ? btn('logFx', p.id, 'Ghi buổi xạ', 'primary') : ''); } }
    ], null, 'Không có bệnh nhân tạm ngừng.');
    return html;
  }

  // ---------- KTV: lịch tuần ----------
  function renderWeek() {
    var t = today();
    if (!S.week) S.week = RT.monday(t);
    var days = [0, 1, 2, 3, 4, 5].map(function (i) { return RT.addDays(S.week, i); });
    var machines = S.data.dm.MAY || [];
    var may = S.fMay || machines[0];
    var e = env();
    var list = pts().filter(function (p) {
      if ((p.may || machines[0]) !== may) return false;
      if (p.trang_thai === 'DANG_XA' || p.trang_thai === 'TAM_NGUNG') return true;
      return p.trang_thai === 'CHO_XA' && p.ngay_du_kien && p.ngay_du_kien <= days[5];
    }).sort(function (a, b) { return a.ho_ten.localeCompare(b.ho_ten, 'vi'); });
    var counts = days.map(function () { return 0; });
    var downs = (S.data.exceptions || []).filter(function (x) { return x.loai === 'MAY_NGHI' && x.may === may && x.ngay >= t; }).sort(function (a, b) { return a.ngay < b.ngay ? -1 : 1; });
    var rows = list.map(function (p) {
      var c = course(p);
      var cells = days.map(function (d, i) {
        var cls = 'wk', txt = '', title = fdw(d);
        var holiday = S.data.holidays.indexOf(d) >= 0, down = RT.isDown(p, d, e);
        var ex = RT.exceptionOf(p, d, e);
        var pi = c.projected.indexOf(d);
        var fxIdx = -1;
        c.fx.forEach(function (f, k) { if (f.ngay === d) fxIdx = k; });
        if (fxIdx >= 0) { cls += ' done'; txt = '✓ ' + (fxIdx + 1); counts[i]++; title += ': đã xạ buổi ' + (fxIdx + 1); }
        else if (holiday || down) { cls += ' closed'; txt = holiday ? 'Lễ' : 'Máy nghỉ'; }
        else if (pi >= 0) {
          var n = c.done + pi + 1;
          cls += pi >= c.tentativeFrom ? ' plan tent' : ' plan'; txt = String(n); counts[i]++;
          title += ': dự kiến buổi ' + n + (pi >= c.tentativeFrom ? ' (chờ KH boost)' : '');
        } else if (d < t && c.missed.indexOf(d) >= 0) { cls += ' miss'; txt = 'vắng'; }
        else if (RT.isTreatDay(p, d, e) && p.trang_thai === 'TAM_NGUNG') { cls += ' paused'; txt = 'ngừng'; }
        else { cls += ' off'; txt = '–'; }
        if (ex) { cls += ' ex'; title += ex === 'NGHI' ? ' · nghỉ riêng tuần này' : ' · xạ thêm riêng tuần này'; }
        var editable = can('setDay') && d >= t && fxIdx < 0 && !holiday && !down && p.trang_thai !== 'TAM_NGUNG' && (c.done < c.total);
        if (d === t) cls += ' today';
        return editable ? '<td><button class="' + cls + '" data-wk="' + esc(p.id) + '" data-d="' + d + '" title="' + esc(title + ' · bấm để đổi xạ/nghỉ') + '">' + txt + '</button></td>'
          : '<td><span class="' + cls + '" title="' + esc(title) + '">' + txt + '</span></td>';
      }).join('');
      return '<tr><td class="wk-pt" data-open="' + esc(p.id) + '">' + ptCell(p) + '</td><td class="nowrap">' + esc(c.cur.ky_thuat) + (c.multi ? ' <span class="tag boost">' + c.cur.label + '</span>' : '') +
        '<span class="sub">' + (RT.needsOffDay(p) ? '<span style="color:var(--warn)">Chưa chọn ngày nghỉ</span>' : esc(RT.scheduleLabel(p))) + '</span></td>' +
        '<td class="nowrap num">' + c.done + '/' + c.total + '<span class="sub">KT ' + fd(c.end) + '</span></td>' + cells + '</tr>';
    }).join('');
    var head = days.map(function (d) { return '<th class="' + (d === t ? 'wk-today' : '') + '">' + fdw(d) + '</th>'; }).join('');
    var foot = counts.map(function (n, i) { return '<td class="wk-count' + (days[i] === t ? ' wk-today' : '') + '"><b>' + n + '</b> ca</td>'; }).join('');
    var html = '<div class="page-head"><div><h1>Lịch tuần</h1><p>Bấm vào một ô để đổi ngày xạ ↔ nghỉ cho riêng tuần đó. Ngày nghỉ cố định hằng tuần đổi ở nút “Xếp lịch”.</p></div>' +
      '<div class="filters">' + noticeBtn() + (machines.length > 1 ? '<select data-filter="fMay" aria-label="Chọn máy">' + opts(machines, may) + '</select>' : '') +
      '<div class="seg"><button data-wknav="-7" aria-label="Tuần trước">‹</button><button data-wknav="0">Tuần này</button><button data-wknav="7" aria-label="Tuần sau">›</button></div></div></div>';
    html += '<div class="card pad"><div class="group-head"><h3>' + esc(may) + ' · ngày máy nghỉ sắp tới</h3>' + (can('machineDown') ? '<button class="btn" data-mdown="1">+ Ghi ngày máy nghỉ</button>' : '') + '</div>' +
      (downs.length ? '<div class="chips">' + downs.map(function (x) { return '<span class="chip">' + fdw(x.ngay) + (x.ghi_chu ? ' · ' + esc(x.ghi_chu) : '') + (can('machineUp') ? '<button aria-label="Bỏ" data-mup="' + esc(x.id) + '">×</button>' : '') + '</span>'; }).join('') + '</div>'
        : '<span class="muted">Không có. Khi máy bảo trì hoặc hỏng, ghi vào đây để lịch của BN tự lùi.</span>') + '</div>';
    html += '<div class="legend"><span><i style="background:var(--ktv-soft)"></i>Đã xạ</span><span><i style="border:1px solid var(--accent-2);background:var(--accent-soft)"></i>Dự kiến xạ</span><span><i style="border:1px dashed var(--ks)"></i>Chờ KH boost</span><span><i style="background:var(--crit-soft)"></i>Vắng</span><span><i style="box-shadow:inset 0 0 0 2px var(--warn)"></i>Đổi riêng tuần này</span></div>';
    html += list.length ? '<div class="card"><div class="tbl-wrap"><table class="wk-table"><thead><tr><th>Bệnh nhân</th><th>Kỹ thuật · lịch</th><th>Buổi</th>' + head + '</tr></thead><tbody>' + rows +
      '</tbody><tfoot><tr><td colspan="3" class="wk-count">Tổng số ca</td>' + foot + '</tr></tfoot></table></div></div>'
      : '<div class="card"><div class="empty">Không có bệnh nhân xạ trên ' + esc(may) + ' trong tuần này.</div></div>';
    return html;
  }
  function bindWeek() {
    $$('#main [data-wknav]').forEach(function (b) { b.onclick = function () { var n = +b.dataset.wknav; S.week = n ? RT.addDays(S.week, n) : RT.monday(today()); renderMain(); }; });
    $$('#main [data-wk]').forEach(function (b) {
      b.onclick = function () {
        var p = byId(b.dataset.wk), d = b.dataset.d;
        run('setDay', { bn_id: p.id, ngay: d, xa: !RT.isTreatDay(p, d, env()) });
      };
    });
    $$('#main [data-mup]').forEach(function (b) { b.onclick = function () { run('machineUp', { id: b.dataset.mup }); }; });
    $$('#main [data-mdown]').forEach(function (b) {
      b.onclick = function () {
        var machines = S.data.dm.MAY || [];
        modal({ title: 'Ghi ngày máy nghỉ', ok: 'Ghi máy nghỉ', btnClass: 'danger',
          body: '<div class="form">' + field('Máy', '<select name="may">' + opts(machines, S.fMay || machines[0]) + '</select>') +
            field('Ngày', '<input type="date" name="ngay" min="' + today() + '" value="' + today() + '">') +
            field('Lý do', '<input type="text" name="ghi_chu" placeholder="VD: Bảo trì định kỳ, hỏng MLC">', 'full') + '</div>' +
            '<p class="muted">BN xạ trên máy này sẽ được lùi lịch thêm một buổi. KTV vẫn nên báo trước cho BN.</p>',
          validate: function (v) { return v.ngay ? '' : 'Chọn ngày.'; },
          onOk: function (v) { run('machineDown', v); } });
      };
    });
  }

  // ---------- KTV: xếp lịch ----------
  function renderSchedule() {
    var t = today();
    var noDate = pts().filter(function (p) { return p.trang_thai === 'CHO_XA' && !p.ngay_du_kien; });
    var dated = pts().filter(function (p) { return p.trang_thai === 'CHO_XA' && p.ngay_du_kien; }).sort(function (a, b) { return a.ngay_du_kien < b.ngay_du_kien ? -1 : 1; });
    var upcoming = pts().filter(function (p) { return ['CHO_KH', 'DANG_KH', 'CHO_QA'].indexOf(p.trang_thai) >= 0; }).sort(function (a, b) { return RT.STATUS_ORDER.indexOf(b.trang_thai) - RT.STATUS_ORDER.indexOf(a.trang_thai); });
    var tx = pts().filter(function (p) { return p.trang_thai === 'DANG_XA'; }).sort(function (a, b) { return (RT.needsOffDay(b) ? 1 : 0) - (RT.needsOffDay(a) ? 1 : 0) || a.ho_ten.localeCompare(b.ho_ten, 'vi'); });
    var schedAct = { h: '', cls: 'act', v: function (p) { return can('schedule') ? btn('schedule', p.id, p.trang_thai === 'DANG_XA' ? 'Đổi lịch' : 'Xếp lịch', p.ngay_du_kien || p.trang_thai === 'DANG_XA' ? '' : 'primary') : ''; } };

    // tải máy 6 ngày làm việc tới
    var days = [], d = t;
    for (var i = 0; days.length < 6 && i < 14; i++, d = RT.addDays(d, 1)) if (RT.dow(d) !== 0) days.push(d);
    var loadPts = pts().filter(function (p) { return ['CHO_XA', 'DANG_XA'].indexOf(p.trang_thai) >= 0; });
    var load = days.map(function (day) {
      var n = 0;
      loadPts.forEach(function (p) { var c = course(p); if (c.projected.indexOf(day) >= 0 || (day === t && c.doneToday)) n++; });
      return '<div class="' + (day === t ? 'today' : '') + '"><span class="d">' + fdw(day) + '</span><span class="v">' + n + '</span></div>';
    }).join('');

    var html = '<div class="page-head"><div><h1>Xếp lịch xạ</h1><p>3D-CRT: xạ T2–T6. IMRT/VMAT: chọn một ngày nghỉ trong tuần, xạ bù Thứ Bảy.</p></div></div>';
    html += '<section class="group"><div class="group-head"><h2>Số BN dự kiến xạ 6 ngày tới</h2><span class="hint">Dùng để cân đối ngày nghỉ của BN IMRT/VMAT</span></div><div class="load">' + load + '</div></section>';
    var sims = items().filter(function (x) { return x.trang_thai === 'MO_PHONG'; }).sort(function (a, b) { return (a.ngay_mo_phong || '9') < (b.ngay_mo_phong || '9') ? -1 : 1; });
    if (sims.length) html += group('sim', 'Chờ mô phỏng', sims, [C.pt, C.rx, { h: 'Loại', v: function (p) { return p._g ? '<span class="tag boost">Mô phỏng lại (boost)</span>' : 'Mô phỏng lần đầu'; } },
      { h: 'Hẹn mô phỏng', cls: 'nowrap', v: function (p) { return p.ngay_mo_phong ? '<span class="num">' + fdw(p.ngay_mo_phong) + '</span>' : '<span class="muted">Chưa hẹn</span>'; } },
      { h: 'Hạn', v: function (p) { return boostFlag(p) || '<span class="muted">—</span>'; } }, C.bs,
      { h: '', cls: 'act', v: function (p) { return can('simDone') ? btn('simDone', p.id, 'Đã mô phỏng xong', 'primary') : ''; } }], null, '');
    html += group('nodate', 'Chờ vào xạ, chưa có lịch', noDate, [C.pt, C.rx, C.week,
      { h: 'Sẵn sàng từ', cls: 'nowrap', v: function (p) { var s = p.ngay_qa || p.ngay_kh_xong; return '<span class="num">' + fd(s) + '</span><span class="sub">' + (p.qa_ket_qua === 'Đạt' ? 'QA đạt' : 'Không cần QA') + '</span>'; } },
      C.bs, schedAct], null, 'Tất cả BN chờ vào xạ đã có lịch.');
    html += group('dated', 'Chờ vào xạ, đã có lịch', dated, [C.pt, C.rx, C.expected, C.week, C.end, schedAct], null, 'Không có.');
    html += group('tx', 'Đang xạ', tx, [C.pt, C.rx, C.week, C.prog, C.end, schedAct], null, 'Không có bệnh nhân đang xạ.');
    html += group('up', 'Sắp chuyển xạ', upcoming, [C.pt, C.rx, C.st, C.expected, schedAct], 'BN đang lập KH hoặc chờ QA; có thể xếp trước ngày dự kiến.', 'Không có.');
    return html;
  }

  // ---------- Tất cả ----------
  function renderAll() {

  /** So sánh dữ liệu cũ và mới (do người khác cập nhật) để báo việc mới cho đúng người */
  function computeNotes(oldD, newD) {
    var meU = newD.me, mine = function (p) { return RT.myDoctors(meU).indexOf(p.bs_email) >= 0; };
    var r = meU.vai_tro, out = [];
    var st = {}, gst = {};
    oldD.patients.forEach(function (p) { st[p.id] = p.trang_thai; });
    (oldD.phases || []).forEach(function (g) { gst[g.id] = g.trang_thai; });
    var name = function (p) { return p.ho_ten + ' (' + p.ma_his + ')'; };
    newD.patients.forEach(function (p) {
      var o = st[p.id], n = p.trang_thai;
      if (o === n) return;
      var doc = (r === 'BS' || (r === 'ADMIN' && /^\s*(BS|ThS|TS|PGS)/i.test(meU.ho_ten || ''))) && mine(p);
      if (doc) {
        if (n === 'CHO_XA' && o) out.push({ pid: p.id, text: name(p) + ': kế hoạch xong, chờ vào xạ' });
        else if (n === 'DANG_KH' && o === 'CHO_QA') out.push({ pid: p.id, text: name(p) + ': QA không đạt, kỹ sư lập lại KH' });
        else if (n === 'CONTOUR' && (o === 'CHO_KH' || o === 'DANG_KH')) out.push({ pid: p.id, text: name(p) + ': kỹ sư trả lại contour' });
        else if (n === 'CONTOUR' && o === 'MO_PHONG') out.push({ pid: p.id, text: name(p) + ': đã mô phỏng, chờ bác sĩ contour' });
        else if (n === 'TAM_NGUNG') out.push({ pid: p.id, text: name(p) + ': tạm ngừng xạ' });
        else if (!o && n !== 'HOAN_THANH') out.push({ pid: p.id, text: 'BN mới của bạn: ' + name(p) });
      }
      if ((r === 'KS') && n === 'CHO_KH') out.push({ pid: p.id, text: (p.uu_tien === 'Cấp cứu' ? 'CẤP CỨU · ' : '') + name(p) + ': contour xong, chờ lập KH' });
      if (r === 'KTV' && n === 'CHO_XA') out.push({ pid: p.id, text: name(p) + ': chờ vào xạ, cần xếp lịch' });
      if (r === 'KTV' && n === 'MO_PHONG' && !o) out.push({ pid: p.id, text: name(p) + ': chờ mô phỏng' });
    });
    (newD.phases || []).forEach(function (g) {
      var o = gst[g.id], n = g.trang_thai;
      if (o === n) return;
      var p = newD.patients.filter(function (x) { return x.id === g.bn_id; })[0];
      if (!p) return;
      if (r === 'KS' && n === 'CHO_KH') out.push({ pid: p.id, text: name(p) + ': boost GĐ' + g.stt + ' chờ lập KH' });
      if ((r === 'BS' || r === 'ADMIN') && mine(p) && n === 'SAN_SANG') out.push({ pid: p.id, text: name(p) + ': KH boost GĐ' + g.stt + ' đã sẵn sàng' });
      if (r === 'KTV' && n === 'MO_PHONG') out.push({ pid: p.id, text: name(p) + ': boost cần mô phỏng lại' });
    });
    var oldN = {};
    (oldD.exceptions || []).forEach(function (e) { if (e.loai === 'THONG_BAO') oldN[e.id] = 1; });
    (newD.exceptions || []).forEach(function (e) {
      if (e.loai === 'THONG_BAO' && !oldN[e.id] && e.nguoi !== meU.email) out.push({ pid: '', text: 'Thông báo' + (e.may ? ' ' + e.may : '') + ': ' + e.ghi_chu });
    });
    var tm = new Date(), hh = (tm.getHours() < 10 ? '0' : '') + tm.getHours() + ':' + (tm.getMinutes() < 10 ? '0' : '') + tm.getMinutes();
    out.forEach(function (x) { x.time = hh; });
    return out;
  }

  // ---------- Thống kê ----------
  function statsRange(k) {
    var t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var last = function (yy, mm) { return new Date(Date.UTC(yy, mm, 0)).getUTCDate(); };
    if (k === 'today') return [t, t];
    if (k === 'week') return [RT.monday(t), t];
    if (k === 'month') return [y + '-' + pad(m) + '-01', t];
    if (k === 'prev') { var py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; return [py + '-' + pad(pm) + '-01', py + '-' + pad(pm) + '-' + pad(last(py, pm))]; }
    return [S.stTu || RT.addDays(t, -30), S.stDen || t];
  }

    html += '<div class="card pad"><div class="filters"><div class="seg" role="group" aria-label="Khoảng thời gian">' +

  function closeDetail() { S.detail = null; $('#drawer').hidden = true; $('#drawer').innerHTML = ''; }

  function calendar(p, c) {
    var dates = c.fx.map(function (f) { return f.ngay; }).concat(c.projected, c.missed);
    if (!dates.length) return '<p class="muted">Chưa có lịch xạ. Kỹ thuật viên sẽ xếp ngày bắt đầu.</p>';
    dates.sort();
    var first = dates[0], last = dates[dates.length - 1];
    if (today() > last && p.trang_thai !== 'HOAN_THANH') last = today();
    var start = RT.addDays(first, -((RT.dow(first) + 6) % 7));
    var end = RT.addDays(last, (7 - RT.dow(last)) % 7);
    var fxByDay = {};
    c.fx.forEach(function (f, i) { (fxByDay[f.ngay] = fxByDay[f.ngay] || []).push({ n: i + 1, f: f }); });
    var abbr = function (s) {
      return RT.splitList(s).map(function (k) { return /CBCT/i.test(k) ? 'C' : /kV/i.test(k) ? 'K' : /MV/i.test(k) ? 'M' : /SGRT|C-RAD/i.test(k) ? 'S' : k.charAt(0); }).join('');
    };
    var h = '<div class="cal">' + ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(function (x) { return '<div class="h">' + x + '</div>'; }).join('');
    for (var d = start, i = 0; d <= end && i < 140; d = RT.addDays(d, 1), i++) {
      var cls = 'c', inner = '<span class="dd">' + fd(d) + '</span>', title = fdw(d);
      if (fxByDay[d]) {
        cls += ' done';
        inner += '<span><span class="fx">#' + fxByDay[d].map(function (x) { return x.n; }).join(',') + '</span> <span class="ic">' + fxByDay[d].map(function (x) { return abbr(x.f.hinh_anh); }).join('') + '</span></span>';
        title += ': đã xạ ' + fxByDay[d].map(function (x) { return 'buổi ' + x.n + (x.f.hinh_anh ? ' (' + x.f.hinh_anh + ')' : ''); }).join(', ');
      } else if (c.missed.indexOf(d) >= 0) { cls += ' miss'; inner += '<span>vắng</span>'; title += ': có lịch nhưng không xạ'; }
      else if (c.projected.indexOf(d) >= 0) { cls += c.projected.indexOf(d) >= c.tentativeFrom ? ' plan tent' : ' plan'; inner += '<span>#' + (c.done + c.projected.indexOf(d) + 1) + '</span>'; title += ': dự kiến buổi ' + (c.done + c.projected.indexOf(d) + 1); }
      else if (d < first || d > last) cls += ' blank off';
      else { cls += ' off'; title += ': không có lịch'; }
      if (d === today()) cls += ' today';
      h += '<div class="' + cls + '" title="' + esc(title) + '">' + inner + '</div>';
    }
    h += '</div><div class="legend"><span><i style="background:var(--ktv-soft)"></i>Đã xạ</span><span><i style="border:1px dashed var(--accent)"></i>Dự kiến</span><span><i style="background:var(--crit-soft)"></i>Vắng</span><span>C = CBCT · K = kV-kV · M = MV · S = SGRT</span></div>';
    return h;
  }

  /** Các đợt xạ khác cùng mã HIS (đang có + lưu trữ). null = đang tải từ lưu trữ. */
  S.hist = {};
  function histFor(p) {
    var key = p.ma_his;
    var live = pts().filter(function (x) { return x.ma_his === key && x.id !== p.id; });
    if (!(key in S.hist)) {
      S.hist[key] = null;
      lookupHis(key).then(function () {
        var rows = (S.hisCache[key] || []).filter(function (x) { return x.luu_tru === 'Có'; }).map(function (x) { var o = {}; Object.keys(x).forEach(function (k) { o[k] = x[k]; }); o._idx = true; return o; });
        mergeArch({ patients: rows });
        S.hist[key] = rows.map(function (x) { return x.id; });
        if (S.detail) renderDetail();
      });
    }
    if (S.hist[key] === null) return live.length ? live : null;
    var arch = (S.hist[key] || []).map(function (id) { return S.arch.patients.filter(function (x) { return x.id === id; })[0]; })
      .filter(function (x) { return x && x.id !== p.id; });
    return live.concat(arch).sort(function (a, b) { return (a.ngay_tao || '') < (b.ngay_tao || '') ? 1 : -1; });
  }
  function mergeArch(a) {
    S.arch = S.arch || { patients: [], phases: [], fractions: [] };
    ['patients', 'phases', 'fractions'].forEach(function (k) {
      (a[k] || []).forEach(function (x) {
        if (S.arch[k].some(function (y) { return y.id === x.id; })) return;
        if (k === 'patients') x._arch = true;
        S.arch[k].push(x);
      });
    });
    S.archEnv = null;
  }

          '<div class="field" data-boost><label>Kỹ thuật boost</label><select name="b_ky_thuat">' + opts(d.KY_THUAT, '', 'Chọn') + '</select></div>' +
          '<div class="field" data-boost><label>Liều boost (Gy) / số buổi</label><div style="display:flex;gap:6px"><input type="number" step="0.01" name="b_tong_lieu" placeholder="Gy" aria-label="Liều boost"><input type="number" step="1" name="b_so_buoi" placeholder="buổi" aria-label="Số buổi boost"></div></div>' +
          '<div class="field full" data-boost><span class="lb">Kế hoạch boost</span><div class="radios">' + BOOST_KINDS.map(function (k, i) { return '<label><input type="radio" name="b_buoc" value="' + k[0] + '"' + (i === 0 ? ' checked' : '') + '><span><b>' + k[1] + '</b><small>' + k[2] + '</small></span></label>'; }).join('') + '</div></div>' : '') +
        '</div></details></div>',
      onMount: function (form) {
        var upd = function () { var v = formValues(form), n = RT.num(v.so_buoi), t = RT.num(v.tong_lieu); $('#dpf', form).textContent = n && t ? '= ' + (Math.round(t / n * 100) / 100) + ' Gy/buổi' : ''; };
        $$('input', form).forEach(function (el) { el.addEventListener('input', upd); }); upd();
        bindIcd(form);
        var cb = $('#co-boost', form), more = $('#more', form);
        var step = function () {
          var st = (formValues(form).trang_thai) || '';
          var early = isNew ? (st === 'MO_PHONG' || st === 'CONTOUR' || !st) && !(cb && cb.checked) : ['MO_PHONG', 'CONTOUR'].indexOf(p.trang_thai) >= 0;
          $$('.rx-req', form).forEach(function (el) { el.hidden = early; });
          $$('.icd-req', form).forEach(function (el) { el.hidden = !(isNew && st === 'CHO_KH'); });
          $$('[data-for]', form).forEach(function (el) { el.hidden = !isNew || el.dataset.for.split(' ').indexOf(st) < 0; });
          var hs = STEPS.filter(function (x) { return x[0] === st; })[0];
          if ($('#step-help', form)) $('#step-help', form).textContent = hs ? hs[2] : 'Bấm để chọn: chưa mô phỏng, đang contour, chờ lập KH…';
          if (isNew) {
            $('#more-lb', form).textContent = early ? '(không bắt buộc ở bước này)' : '(bắt buộc ở bước này' + (st === 'CHO_KH' ? ': mã ICD-10, ' : ': ') + 'chẩn đoán, kỹ thuật, liều, số buổi)';
            if (!early) more.open = true;
          }
        };
        if ($('#step-sel', form)) $('#step-sel', form).addEventListener('change', step);
        var bt = function () { $$('[data-boost]', form).forEach(function (el) { el.hidden = !cb || !cb.checked; }); step(); };
        if (cb) cb.addEventListener('change', bt); bt();
        // Tra mã HIS: các đợt xạ trước (kể cả đã lưu trữ), cảnh báo khác tên
        var his = $('input[name=ma_his]', form), nameEl = $('input[name=ho_ten]', form), note = $('#his-note', form);
        var show = function () {
          var ma = his.value.trim();
          if (!ma || (!isNew && ma === p.ma_his && RT.fold(nameEl.value) === RT.fold(p.ho_ten))) { note.hidden = true; return; }
          var list = hisMatches(ma, exceptId);
          if (!list.length) { note.hidden = true; return; }
          var diff = nameEl.value.trim() && list.filter(function (x) { return RT.fold(x.ho_ten) !== RT.fold(nameEl.value); })[0];
          var cur = list[0];
          note.className = 'full his-note' + (diff ? ' bad' : '');
          note.innerHTML = (diff ? '<b>Cảnh báo: mã HIS này đã dùng cho bệnh nhân tên “' + esc(diff.ho_ten) + '”</b>, khác tên đang nhập. Kiểm tra lại mã HIS trước khi lưu.<br>' : '') +
            'Mã HIS <b class="mono">' + esc(ma) + '</b> đã có ' + list.length + ' đợt xạ:<ul>' + list.slice(0, 6).map(function (x) {
              return '<li><span class="mono">' + esc(x.id) + '</span> · ' + esc(x.ho_ten) + (x.nam_sinh ? ' (' + esc(x.nam_sinh) + ')' : '') + ' · ' + esc(x.vi_tri || x.chan_doan || '—') +
                ' · <b>' + esc(RT.STATUS[x.trang_thai] || x.trang_thai) + '</b>' + (x.ngay_bat_dau ? ' · xạ từ ' + fdy(x.ngay_bat_dau) : '') + (x.luu_tru === 'Có' || x._arch ? ' · <i>lưu trữ</i>' : '') + '</li>';
            }).join('') + '</ul>' +
            (isNew && !nameEl.value.trim() ? '<button type="button" class="btn sm" id="his-fill">Điền họ tên, năm sinh, giới từ đợt trước</button>' : '');
          note.hidden = false;
          var fb = $('#his-fill', note);
          if (fb) fb.onclick = function () {
            nameEl.value = cur.ho_ten || ''; $('input[name=nam_sinh]', form).value = cur.nam_sinh || '';
            if (cur.gioi) $('select[name=gioi]', form).value = cur.gioi;
            show();
          };
        };
        var look = function () { var ma = his.value.trim(); lookupHis(ma).then(function () { if (his.value.trim() === ma) show(); }); show(); };
        his.addEventListener('change', look);
        nameEl.addEventListener('change', show);
        if (his.value) look();
      },
      validate: function (v) {
        if (!v.ma_his) return 'Cần nhập mã BN trên HIS.';
        if (!v.ho_ten) return 'Cần nhập họ tên.';
        if (!v.nam_sinh) return 'Cần nhập năm sinh hoặc tuổi.';
        if (isNew && !v.trang_thai) return 'Cần chọn bước hiện tại của bệnh nhân (chưa mô phỏng, đang contour…).';
        if (!v.bs_email) return 'Cần chọn bác sĩ điều trị.';
        if (v.icd && !RT.isIcd(RT.normIcd(v.icd))) return 'Mã ICD-10 chưa đúng dạng (VD: C50.9).';
        var early = isNew ? (!v.trang_thai || v.trang_thai === 'MO_PHONG' || v.trang_thai === 'CONTOUR') && !v.co_boost : ['MO_PHONG', 'CONTOUR'].indexOf(p.trang_thai) >= 0;
        if (!early) {
          var miss = RT.missingRx(v, isNew && v.trang_thai === 'CHO_KH');
          if (miss.length) return 'Ở bước này cần nhập đủ: ' + miss.join(', ') + '.';
        }
        if (v.co_boost) {
          if (!v.b_ky_thuat) return 'Chọn kỹ thuật boost.';
          if (!(RT.num(v.b_tong_lieu) > 0) || !(RT.num(v.b_so_buoi) >= 1)) return 'Nhập liều và số buổi boost.';
        }
        if (isNew && v.trang_thai === 'DANG_XA') {
          if (!v.ngay_bat_dau) return 'Cần nhập ngày bắt đầu xạ.';
          if (!(RT.num(v.da_xa) >= 1)) return 'Cần nhập số buổi đã xạ.';
          var lim = RT.num(v.so_buoi) + (v.co_boost && v.b_buoc === 'SAN_SANG' ? RT.num(v.b_so_buoi) : 0);
          if (RT.num(v.da_xa) >= lim) return 'Số buổi đã xạ phải nhỏ hơn tổng số buổi.';
        }
        return '';
      },
      onOk: function (v) {
        if (v.icd) v.icd = RT.normIcd(v.icd);
        if (isNew) {
          if (v.co_boost) v.boost = { ky_thuat: v.b_ky_thuat, tong_lieu: v.b_tong_lieu, so_buoi: v.b_so_buoi, buoc: v.b_buoc };
          ['co_boost', 'b_ky_thuat', 'b_tong_lieu', 'b_so_buoi', 'b_buoc'].forEach(function (k) { v[k] = undefined; });
          if (prefill && prefill._force) v.force = true;
        } else v.id = p.id;
        var action = isNew ? 'createPatient' : 'updatePatient';
        var send = function () {
          run(action, v, function (e) {
            var m = String(e.error);
            if (m.indexOf('DUP_HIS:') === 0) {
              modal({ title: 'Mã HIS đã có đợt xạ đang hoạt động', body: '<p>Mã HIS <b class="mono">' + esc(v.ma_his) + '</b> đang có đợt xạ: <b>' + esc(m.slice(8)) + '</b>.</p><p>Chỉ tạo thêm nếu đây là một đợt xạ mới của cùng bệnh nhân (VD: xạ vị trí khác).</p>',
                ok: 'Vẫn tạo đợt mới', btnClass: 'danger', onOk: function () { v.force = true; send(); } });
              return true;
            }
            if (m.indexOf('HIS_NAME:') === 0) {
              modal({ title: 'Mã HIS đã dùng cho bệnh nhân khác tên', body: '<p>Mã HIS <b class="mono">' + esc(v.ma_his) + '</b> đã có trong hệ thống với tên <b>' + esc(m.slice(9)) + '</b>, khác tên đang nhập <b>' + esc(v.ho_ten) + '</b>.</p>' +
                '<p>Thường do gõ nhầm mã HIS. Bấm <b>Huỷ</b> để sửa lại. Chỉ lưu nếu chắc chắn đúng (VD: đã đổi tên, tên cũ nhập sai).</p>',
                ok: 'Vẫn lưu', btnClass: 'danger', onOk: function () { v.force_name = true; send(); } });
              return true;
            }
          });
        };
        lookupHis(v.ma_his).then(send);
      }
    });
  }

  var BOOST_KINDS = [
    ['CUNG_LUC', 'Lập KH boost cùng lúc với GĐ1', 'Contour và lập kế hoạch cùng đợt với GĐ1'],
    ['CONTOUR', 'Contour boost trên CT cũ', 'Bác sĩ contour boost sau (thường khi gần hết GĐ1)'],
    ['MO_PHONG', 'Cần mô phỏng lại', 'Chụp CT mô phỏng lại, rồi contour và lập KH boost'],
    ['SAN_SANG', 'Đã có KH boost', 'Dùng khi nhập BN đã có sẵn kế hoạch boost']
  ];
  function phaseForm(p, g) {
    var isNew = !g, d = S.data.dm, v0 = g || { uu_tien: p.uu_tien || 'Thường' };
    var inp = function (name, type, attrs) { return '<input type="' + (type || 'text') + '" name="' + name + '" value="' + esc(v0[name] || '') + '" ' + (attrs || '') + '>'; };
    modal({ title: isNew ? 'Thêm boost (GĐ' + (course(p).segs.length + 1) + ')' : 'Sửa boost GĐ' + g.stt, ok: isNew ? 'Thêm boost' : 'Lưu',
      body: whoBox(p) + '<div class="form">' +
        field('Kỹ thuật <span class="req">*</span>', '<select name="ky_thuat">' + opts(d.KY_THUAT, v0.ky_thuat, 'Chọn') + '</select>') +
        field('Ưu tiên lập KH', '<select name="uu_tien">' + opts(d.UU_TIEN, v0.uu_tien) + '</select>') +
        field('Tổng liều boost (Gy) <span class="req">*</span>', inp('tong_lieu', 'number', 'step="0.01" min="0"')) +
        field('Số buổi <span class="req">*</span>', inp('so_buoi', 'number', 'step="1" min="1" max="60"')) +
        field('Các mức liều (nếu SIB)', inp('muc_lieu'), 'full') +
        (isNew ? '<div class="field full"><span class="lb">Kế hoạch boost</span><div class="radios">' + BOOST_KINDS.map(function (k, i) {
          var dis = k[0] === 'CUNG_LUC' && ['CONTOUR', 'CHO_KH', 'DANG_KH', 'CHO_QA'].indexOf(p.trang_thai) < 0;
          return '<label' + (dis ? ' style="opacity:.5"' : '') + '><input type="radio" name="buoc" value="' + k[0] + '"' + ((dis ? i === 1 : i === 0) ? ' checked' : '') + (dis ? ' disabled' : '') + '><span><b>' + k[1] + '</b><small>' + k[2] + '</small></span></label>';
        }).join('') + '</div></div>' + '<div class="field" data-sim><label>Hẹn mô phỏng lại</label><input type="date" name="ngay_mo_phong" min="' + today() + '"></div>' : '') +
        field('Ghi chú', '<textarea name="ghi_chu">' + esc(v0.ghi_chu || '') + '</textarea>', 'full') + '</div>',
      onMount: function (form) {
        var upd = function () { var v = formValues(form); $$('[data-sim]', form).forEach(function (el) { el.hidden = v.buoc !== 'MO_PHONG'; }); };
        $$('input[name=buoc]', form).forEach(function (el) { el.addEventListener('change', upd); }); upd();
      },
      validate: function (v) {
        if (!v.ky_thuat) return 'Chọn kỹ thuật.';
        if (!(RT.num(v.tong_lieu) > 0) || !(RT.num(v.so_buoi) >= 1)) return 'Nhập liều và số buổi boost.';
        return '';
      },
      onOk: function (v) {
        if (isNew) { v.bn_id = p.id; run('addPhase', v); }
        else { v.id = g.id; v.buoc = undefined; run('updatePhase', v); }
      } });
  }

  // ---------- khởi động ----------
  function boot() {
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!$('#modal').hidden) closeModal(); else if (S.detail) closeDetail();
    });
    // Tự tải lại dữ liệu mỗi 60 giây và khi quay lại tab, để thấy cập nhật của người khác
    // Mỗi 30 giây hỏi máy chủ "có ai vừa sửa gì không" (rất nhẹ); chỉ khi có thay đổi mới tải lại dữ liệu
    var fullReload = function () {
      var y = window.scrollY;
      call('bootstrap').then(function (r) {
        if (pending.length) return;
        var notes = S.data ? computeNotes(S.data, r.data) : [];
        setData(r.data); if (r.rev) S.rev = r.rev;
        pushNotes(notes);
        render(); window.scrollTo(0, y);
      }, function () {});
    };
    var refresh = function () {
      if (!S.data || S.busy > 0 || pending.length || document.hidden || !$('#modal').hidden) return;
      if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      call('rev').then(function (r) {
        if (r.rev && r.rev === S.rev) return;
        fullReload();
      }, function () { if (Date.now() - S.lastLoad > 60000) fullReload(); });
    };
    setInterval(refresh, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
    setBusy(1);
    call('bootstrap').then(function (r) { setData(r.data); if (r.rev) S.rev = r.rev; render(); }, function (e) {
      var msg = String(e.error || '');
      var html;
      if (msg.indexOf('NO_ACCESS:') === 0) html = '<h1>Tài khoản chưa được cấp quyền</h1><p>Tài khoản <b class="mono">' + esc(msg.slice(10)) + '</b> chưa có trong danh sách người dùng.</p><p class="muted">Gửi địa chỉ email này cho quản trị để được thêm vào trang tính <b>NguoiDung</b>, rồi tải lại trang.</p>';
      else if (/googleapis\.com\/auth|thực hiện lệnh gọi|required permissions|not have permission to call/i.test(msg)) html =
        '<h1>Chưa cấp đủ quyền cho ứng dụng</h1><p>Lúc cấp quyền lần đầu, tài khoản của bạn chưa tích đủ các ô quyền. Làm 2 bước sau (khoảng 1 phút):</p>' +
        '<ol><li>Mở <b>myaccount.google.com/connections</b>, chọn ứng dụng <b>Điều phối Xạ trị</b> (hoặc "Dự án không có tiêu đề") → <b>Xoá mọi quyền truy cập</b>.</li>' +
        '<li>Mở lại link ứng dụng. Khi Google hỏi quyền: <b>Nâng cao → Đi tới… → tích “Chọn tất cả”</b> → <b>Tiếp tục</b>.</li></ol>' +
        '<p class="muted">Chi tiết lỗi: ' + esc(msg) + '</p>';
      else if (/access|quyền truy cập|not found|không tìm thấy/i.test(msg) && /openById|tài liệu|document|spreadsheet/i.test(msg)) html =
        '<h1>Chưa được chia sẻ dữ liệu</h1><p>Tài khoản của bạn chưa được chia sẻ Google Sheet dữ liệu của khoa. Nhờ quản trị chia sẻ (quyền Người chỉnh sửa) cho email của bạn, rồi tải lại trang.</p>' +
        '<p class="muted">Chi tiết lỗi: ' + esc(msg) + '</p>';
      else html = '<h1>Không tải được dữ liệu</h1><p>' + esc(msg) + '</p>';
      $('#main').innerHTML = '<div class="main-in"><div class="notice">' + html + '</div></div>';
    }).finally(function () { setBusy(-1); });
  }
  boot();
})();

</script>
</body>
</html>
